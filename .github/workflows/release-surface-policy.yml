name: Release Surface Policy

on:
  pull_request:
    branches:
      - develop
      - 1.20.x
  push:
    branches:
      - develop
      - 1.20.x

permissions:
  contents: read

jobs:
  release-surface-policy:
    name: Release surface policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out locked source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test policy
        run: python -m unittest discover -s .github/release_policy -p "test_*.py"

      - name: Verify release surfaces
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python .github/release_policy/verify_release_surfaces.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
