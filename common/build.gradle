architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
}

dependencies {
    compileOnly("maven.modrinth:patchouli:AveV4Tjn") { transitive = false } // Patchouli 26.1-94 API (runtime: a 26.2 build of Patchouli)
    // Depend on Fabric Loader here to use the Fabric @Environment annotations
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Architectury API
    compileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"

    // ── ExpectPlatform / injectables  (NEEDED FOR @ExpectPlatform) ─────
    def injectablesVer = "1.0.13"
    compileOnly         "dev.architectury:architectury-injectables:$injectablesVer"
    annotationProcessor "dev.architectury:architectury-injectables:$injectablesVer"

    // GeckoLib API
    compileOnly "maven.modrinth:geckolib:${rootProject.geckolib_modrinth_id}"

    // Fzzy Config API
    compileOnly "me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}"

    // Jade API (26.2 portu: CurseForge dosya kimligi yerine Modrinth maven)
    compileOnly "maven.modrinth:jade:${rootProject.jade_modrinth_version}"

    // 26.2 portu: Patchouli'nin 26.2 surumu yok, rehber kitap devre disi.

    // Iris API (Optional, Compile-Time)
    compileOnly "maven.modrinth:iris:${rootProject.iris_version}-fabric"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

sourceSets.test {
    java.srcDirs = ["src/test_develop/java"]
    resources.srcDirs = ["src/test_develop/resources"]
}

tasks.named("test") {
    useJUnitPlatform()
}
