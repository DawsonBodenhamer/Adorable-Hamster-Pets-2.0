plugins {
    id "architectury-plugin" version "3.5.169"
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    // 26.2 portu: Minecraft 26.2 Java 25 istiyor. Gradle 8.14 kendisi JDK 21'de
    // calisiyor, derlemeyi toolchain uzerinden JDK 25'e yaptiriyoruz.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    base {
        archivesName = rootProject.archives_base_name
    }

    version = "${rootProject.mod_version}-${rootProject.minecraft_version}+${project.name}"
    group = rootProject.maven_group

    repositories {
        maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/" }
        maven { name = "FzzyMaven"; url = "https://maven.fzzyhmstrs.me/" }
        maven { name = "CurseMaven"; url = "https://cursemaven.com" }
        maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
        maven { name = "GeckoLib"; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        maven { name = "Patchouli"; url = 'https://maven.blamejared.com' }
        maven { name = "WispForest"; url = "https://maven.wispforest.io/releases" }
        maven { name = "Su5ed"; url = "https://maven.su5ed.dev/releases" }
        maven { name = "Ladysnake"; url = "https://maven.ladysnake.org/releases" }
        maven { name = "IllusiveSoulworks"; url = "https://maven.theillusivec4.top" }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
        it.options.compilerArgs.add("-Xlint:unchecked")
    }

    java {
        withSourcesJar()
    }
}
