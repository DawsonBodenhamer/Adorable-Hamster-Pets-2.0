plugins {
    id "architectury-plugin" version "3.4.161"
    id "dev.architectury.loom" version "1.9-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // 26.2 port: Minecraft artik obfuscate edilmiyor, Yarn de 26.x icin yok.
        // Mojang resmi isimlendirmesine gecildi.
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    base {
        archivesName = rootProject.archives_base_name
    }

    version = "${rootProject.mod_version}-${rootProject.minecraft_version}+${project.name}"
    group = rootProject.maven_group

    repositories {
        maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/" }
        maven { name = "FzzyMaven"; url = "https://maven.fzzyhmstrs.me/" }
        maven { name = "CurseMaven"; url = "https://cursemaven.com" }
        maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
        maven { name = "GeckoLib"; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        maven { name = "Patchouli"; url = 'https://maven.blamejared.com' }
        maven { name = "WispForest"; url = "https://maven.wispforest.io/releases" }
        maven { name = "Su5ed"; url = "https://maven.su5ed.dev/releases" }
        maven { name = "Ladysnake"; url = "https://maven.ladysnake.org/releases" }
        maven { name = "IllusiveSoulworks"; url = "https://maven.theillusivec4.top" }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
        it.options.compilerArgs.add("-Xlint:unchecked")
    }

    java {
        withSourcesJar()
    }
}
