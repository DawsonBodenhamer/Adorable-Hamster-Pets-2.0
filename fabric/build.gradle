plugins {
    id "com.gradleup.shadow" version "9.2.2"
}
evaluationDependsOn ':common'

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

sourceSets {
    main {
        // 26.2 portu: datagen kodu devre disi. Uretilmis JSON'lar
        // src/main/generated ve common/src/main/resources icinde zaten mevcut.
        java {
            exclude 'net/dawson/adorablehamsterpets/fabric/datagen/**'
        }
        resources {
            srcDir file('src/main/generated')
            exclude('.cache/**')
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    compileOnly files("/Users/muratdugan/PROJECTS/PatchouliPort/src/Fabric/build/libs/patchouli-fabric-26.2-94-SNAPSHOT.jar") // 26.2 port: Patchouli API (runtime jar = ported build)
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { version { strictly rootProject.fabric_api_version } }
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // GeckoLib
    implementation "maven.modrinth:geckolib:${rootProject.geckolib_modrinth_id}"

    // Mod Menu
    implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    // Jade
    implementation "maven.modrinth:jade:${rootProject.jade_modrinth_version}"

    // Fzzy Config and its runtime dependencies
    implementation "me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}"
    runtimeOnly "maven.modrinth:fabric-language-kotlin:${rootProject.flk_version}"

    // Placeholder API (for bundling)
    implementation("maven.modrinth:placeholder-api:${rootProject.placeholder_api_version}")

    // 26.2 portu: Patchouli'nin 26.2 surumu yok.

    // 26.2 portu: accessories ve trinkets'in 26.2 surumu yok.

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude(".cache/**")
}

tasks.named("runDatagen") {
    outputs.dir(file('src/main/generated'))
    mustRunAfter("clean")
}

shadowJar {

    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    from(sourceSets.main.output)
    archiveClassifier = ""
    dependsOn project(':common').tasks.named('transformProductionFabric')


    // Exclude the generated hamster bed item model
    from(file('src/main/generated')) {
        exclude 'assets/adorablehamsterpets/models/item/hamster_bed.json'
    }
}

// 26.2 portu: loom-no-remap'te remapJar yok (remap edilecek bir sey yok).
// Nihai jar dogrudan shadowJar ciktisi.
tasks.named("jar") { archiveClassifier = "slim" }
tasks.named("assemble") { dependsOn tasks.named("shadowJar") }

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }

    from(file('src/main/generated'))
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude(".cache/**")
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
